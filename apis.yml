name: Breville Group

description: 'Breville Group Limited (ASX: BRG) is an Australian-headquartered global designer and marketer of premium small kitchen appliances, centred on the Breville brand. Its range spans espresso machines, coffee grinders, countertop ovens and air fryers, juicers, blenders, food processors, sous vide and pizza ovens, plus commercial lines and the Breville+ / Beanz coffee services. Formerly Housewares International Limited (founded 1957, ASX-listed 1999), it acquired the Breville companies in 2001 and renamed itself Breville Group Limited in 2008. No public developer API, documentation or developer portal is published on breville.com or brevillegroup.com.'

